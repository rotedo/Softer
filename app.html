<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screener</title>
<style>
:root{--bg:#0a0d12;--card:#121826;--line:#232d40;--tx:#e8f0ff;--dim:#8f9bb3;--ac:#3d8bff;--up:#2ecc8f;--dn:#ff4d5e;--warn:#f5b042}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 8px 0}
#tabs{display:flex;gap:4px;overflow-x:auto}
#tabs button{flex:1;min-width:80px;background:none;border:0;color:var(--dim);padding:13px 6px;font-size:15px;font-weight:600;border-bottom:3px solid transparent}
#tabs button.on{color:var(--tx);border-color:var(--ac)}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
small,.dim{color:var(--dim);font-size:13px}
input,select,textarea{width:100%;background:#0d1320;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin:4px 0;font-family:inherit}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:220px;white-space:pre;overflow:auto}
button.b{background:#1a2338;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--dn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#1a2338;color:var(--dim)}
.t1{background:#16314f;color:#7cb8ff}.t2{background:#3a2a10;color:var(--warn)}
.up{color:var(--up)}.dn{color:var(--dn)}.wr{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600}
.msg{margin:6px 0;padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.me{background:#1b3a66;margin-left:auto}.ai{background:#161e30;border:1px solid var(--line)}
#chat{min-height:46vh}
.ok{color:var(--up)}.bad{color:var(--dn)}
#lg{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
</style></head><body>
<div id="top"><div id="tabs"></div></div>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['home','Dashboard'],['ai','AI'],['scripts','Scripts'],['settings','Settings']];
let TAB='home', HIST=[], TIMER=null, EDIT=null;
async function api(p,o={}){const r=await fetch(p,Object.assign({credentials:'same-origin',headers:{}},o));
  if(r.status===401){login();throw new Error('login required')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('error '+r.status));return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
const age=s=>s==null?'-':s<90?Math.round(s)+'s':s<5400?Math.round(s/60)+'m':s<172800?Math.round(s/3600)+'h':Math.round(s/86400)+'d';
const tm=ms=>new Date(ms).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

function login(msg){if($('#lg'))return;const d=document.createElement('div');d.id='lg';
 d.innerHTML='<div style="width:100%;max-width:320px"><h2>Screener</h2><div class="dim" id="lgm">Enter admin password</div><input id="lgp" type="password" placeholder="Password"><button class="b p" id="lgb" style="width:100%;margin-top:8px;padding:13px">Login</button></div>';
 document.body.appendChild(d);
 const go=async()=>{try{await post('/api/login',{password:$('#lgp').value});d.remove();show(TAB)}catch(e){$('#lgm').textContent=e.message}};
 $('#lgb').onclick=go;$('#lgp').onkeydown=e=>{if(e.key=='Enter')go()}}

function tabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="${t[0]==TAB?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t))}
function show(t){TAB=t;clearInterval(TIMER);tabs();({home,ai,scripts,settings})[t]()}

/* ---------------- Dashboard ---------------- */
async function home(){
 $('#m').innerHTML='<div class="card"><h2>Welcome \u{1F44B}</h2><small>Screener is watching your liquid coins (Tier 1).</small></div><div id="hd"></div>';
 const draw=async()=>{try{const d=await api('/api/dashboard');
  const t1=d.tiers.filter(x=>x.tier==1).length,t2=d.tiers.filter(x=>x.tier==2).length;
  $('#hd').innerHTML=`<div class="card"><div class="row"><div class="grow"><h3>Coins</h3><b style="font-size:22px">${t1+t2}</b> <small>Tier 1: ${t1} \u00b7 Tier 2: ${t2}</small></div>
   <div class="grow"><h3>Scripts ON</h3><b style="font-size:22px">${d.scripts_on}</b></div>
   <div class="grow"><h3>AI keys</h3><b style="font-size:22px" class="${d.ai_keys?'up':'dn'}">${d.ai_keys}</b></div></div>
   <small>Last screener run: ${d.last.run?tm(d.last.run)+' \u00b7 '+d.last.checked+' checks':'not yet'}</small>${d.last.error?'<div class="wr"><small>'+esc(d.last.error)+'</small></div>':''}</div>
   <div class="card"><h3>Latest alerts</h3>${d.alerts.length?d.alerts.map(a=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="${a.side=='long'?'up':'dn'}"><b>${a.side.toUpperCase()}</b></span><b>${esc(a.sym)}</b><small class="grow">${esc(a.script)} \u00b7 ${a.tf} \u00b7 ${a.price}</small><small>${tm(a.ts)}${a.sent?'':' \u26a0'}</small></div>`).join(''):'<small>No alert yet. Turn a script ON in Scripts.</small>'}</div>
   <div class="card"><h3>Tier coins</h3>${d.tiers.length?d.tiers.map(x=>`<span class="pill t${x.tier}" style="margin:2px">${esc(x.sym.replace('USDT',''))} T${x.tier}</span>`).join(''):'<small>No coin has passed the liquidity filter yet (wait for the first scan).</small>'}</div>`
 }catch(e){$('#hd').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}};
 draw();TIMER=setInterval(draw,15000)}

/* ---------------- AI ---------------- */
function ai(){
 $('#m').innerHTML='<div class="card"><div id="chat"><small>Ask anything about your coins. The AI uses only your collected data. You can also say: "make an alert script for ... " and it will save a script (OFF) for you.</small></div></div><div class="card"><input id="cs" placeholder="Coins (optional): BTC, SOL ... empty = all Tier coins"><div class="row"><input id="ci" class="grow" placeholder="Message\u2026" autocomplete="off"><button class="b" id="mic" title="Voice">\ud83c\udfa4</button><button class="b p" id="cb">Send</button></div><label class="row"><input type="checkbox" id="web" style="width:auto"><small>Web search (Google, works with any AI; needs one Gemini key)</small></label></div>';
 const paint=()=>{$('#chat').innerHTML=HIST.length?HIST.map(h=>`<div class="msg ${h.role=='user'?'me':'ai'}">${esc(h.text)}</div>`).join(''):'<small>Ask anything about your coins.</small>';window.scrollTo(0,document.body.scrollHeight)};
 paint();
 const send=async()=>{const text=$('#ci').value.trim();if(!text)return;$('#ci').value='';HIST.push({role:'user',text});paint();
  const raw=$('#cs').value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);let syms=raw;
  if(!syms.length){try{syms=(await api('/api/dashboard')).tiers.map(t=>t.sym)}catch(e){}}
  HIST.push({role:'ai',text:'\u2026'});paint();
  try{const r=await post('/api/chat',{syms:syms.length?syms:['BTCUSDT'],text,history:HIST.slice(-8,-2),web:$('#web').checked});HIST[HIST.length-1].text=r.answer}
  catch(e){HIST[HIST.length-1].text='Error: '+e.message}paint()};
 $('#cb').onclick=send;$('#ci').onkeydown=e=>{if(e.key=='Enter')send()};
 let rec=null,chunks=[],stopT=null;
 $('#mic').onclick=async()=>{
  if(rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
   const mt=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
   rec=new MediaRecorder(st,mt?{mimeType:mt}:{});chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=async()=>{clearTimeout(stopT);st.getTracks().forEach(t=>t.stop());$('#mic').textContent='\ud83c\udfa4';
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;
    $('#ci').placeholder='Writing\u2026';
    try{const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
     const r=await post('/api/transcribe',{audio:b64,mime:blob.type});$('#ci').value=($('#ci').value+' '+r.text).trim()}
    catch(e){$('#ci').value='';$('#ci').placeholder=e.message;return}
    $('#ci').placeholder='Message\u2026'};
   rec.start();$('#mic').textContent='\u23f9';stopT=setTimeout(()=>rec&&rec.stop(),60000)
  }catch(e){$('#ci').placeholder='Mic blocked: '+e.message}}}

/* ---------------- Scripts ---------------- */
const NEW={id:0,name:'My script',tf:'15m',on:false,code:'# Return 1 (long), -1 (short) or 0 for every candle.\n# c[i] has t,o,h,l,c,v,delta,bp,cvd  |  f has delta,bp,cvd,body,upper,lower  |  helpers: sma ema highest lowest atr math\ndef signals(c, f):\n    out = [0] * len(c)\n    for i in range(1, len(c)):\n        if c[i]["c"] > c[i-1]["h"] and f["delta"][i] > 0:\n            out[i] = 1\n    return out\n'};
async function scripts(){
 $('#m').innerHTML='<div class="card">Loading\u2026</div>';
 try{const d=await api('/api/scripts');
  if(EDIT){editor(EDIT);return}
  $('#m').innerHTML=`<div class="card"><h3>Screener</h3><div class="row"><small>Check every</small><input id="ev" type="number" min="1" max="120" value="${d.cfg.every_min}" style="width:80px"><small>min</small><label class="row"><input type="checkbox" id="aic" ${d.cfg.ai?'checked':''} style="width:auto"><small>AI note in alert</small></label><button class="b" id="cfs">Save</button><button class="b p" id="run">Run now</button></div><div class="row" style="margin-top:8px"><label class="row"><input type="checkbox" id="spo" ${d.cfg.spike.on?'checked':''} style="width:auto"><small>Spike alert</small></label><input id="spp" type="number" step="0.5" min="0.5" value="${d.cfg.spike.pct}" style="width:70px"><small>% in</small><input id="spm" type="number" min="1" max="15" value="${d.cfg.spike.mins}" style="width:60px"><small>min</small><label class="row"><input type="checkbox" id="un2" ${d.cfg.universe=='tier2'?'checked':''} style="width:auto"><small>Tier 2 only</small></label></div><div id="rm" class="dim"></div></div>
  <div class="card"><h3>AI writes a script</h3><textarea id="aip" placeholder="Describe the setup in words (Hindi/English)" style="min-height:70px"></textarea><div class="row"><button class="b p" id="aib">Write script</button><small id="aim" class="dim grow"></small></div></div>
  ${d.scripts.map(s=>`<div class="card"><div class="row"><div class="grow"><b>${esc(s.name)}</b> <span class="pill">${esc(s.tf)}</span><br><small class="${s.on?'up':''}">${s.on?'ON \u2013 sends Telegram alerts':'OFF'}</small></div><button class="b ${s.on?'':'p'}" data-tg="${s.id}">${s.on?'Turn OFF':'Turn ON'}</button><button class="b" data-ed="${s.id}">Edit</button></div></div>`).join('')}
  <button class="b p" id="nw" style="width:100%;padding:13px">+ New script</button>
  <div class="card" style="margin-top:12px"><h3>Alert history</h3>${d.alerts.length?d.alerts.map(a=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="${a.side=='long'?'up':'dn'}"><b>${a.side.toUpperCase()}</b></span><b>${esc(a.sym)}</b><small class="grow">${esc(a.script)} \u00b7 ${a.price}</small><small>${tm(a.ts)}</small></div>`).join(''):'<small>None yet</small>'}</div>`;
  const byId=id=>d.scripts.find(x=>x.id==id);
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const s=byId(b.dataset.tg);try{await post('/api/scripts',{...s,on:!s.on});scripts()}catch(e){$('#rm').textContent=e.message}});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{EDIT=byId(b.dataset.ed);scripts()});
  $('#nw').onclick=()=>{EDIT={...NEW};scripts()};
  $('#cfs').onclick=async()=>{await post('/api/screener/cfg',{every_min:+$('#ev').value||5,ai:$('#aic').checked,universe:$('#un2').checked?'tier2':'tier1',spike:{on:$('#spo').checked,pct:+$('#spp').value||3,mins:+$('#spm').value||5,cooldown:10}});$('#rm').textContent='Saved'};
  $('#aib').onclick=async()=>{$('#aim').textContent='Writing\u2026';try{await post('/api/scripts/ai',{prompt:$('#aip').value});scripts()}catch(e){$('#aim').textContent=e.message}};
  $('#run').onclick=async()=>{$('#rm').textContent='Running\u2026';try{const r=await post('/api/screener/run');$('#rm').textContent=r.new.length+' new alert(s)';scripts()}catch(e){$('#rm').textContent=e.message}};
 }catch(e){$('#m').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
function editor(s){
 $('#m').innerHTML=`<div class="card"><input id="sn" value="${esc(s.name)}" placeholder="Name"><div class="row"><select id="st" style="width:110px">${['5m','15m','1H','4H'].map(t=>`<option ${t==s.tf?'selected':''}>${t}</option>`).join('')}</select><input id="sy" value="BTCUSDT" style="width:130px"><button class="b" id="ts">Test</button></div><textarea id="sc" spellcheck="false" autocapitalize="off">${esc(s.code)}</textarea><div id="se" class="dim"></div><div class="row"><button class="b p" id="sv">Save</button><button class="b" id="cx">Back</button>${s.id?'<button class="b d" id="dl">Delete</button>':''}</div></div>`;
 const body=()=>({id:s.id||undefined,name:$('#sn').value,tf:$('#st').value,code:$('#sc').value,on:s.on});
 $('#ts').onclick=async()=>{$('#se').textContent='Testing\u2026';try{const r=await post('/api/scripts/test',{code:$('#sc').value,sym:$('#sy').value.toUpperCase(),tf:$('#st').value});$('#se').innerHTML='<span class="ok">Works.</span> '+r.signals+' signal(s) in last '+r.candles+' candles. '+(r.last.length?'Last: '+r.last.map(x=>x.side+' @'+x.price).join(', '):'')}catch(e){$('#se').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}};
 $('#sv').onclick=async()=>{try{await post('/api/scripts',body());EDIT=null;scripts()}catch(e){$('#se').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}};
 $('#cx').onclick=()=>{EDIT=null;scripts()};
 if($('#dl'))$('#dl').onclick=async()=>{if(confirm('Delete this script?')){await api('/api/scripts?id='+s.id,{method:'DELETE'});EDIT=null;scripts()}}}

/* ---------------- Settings ---------------- */
async function settings(){
 $('#m').innerHTML='<div id="s-ai"></div><div id="s-tg"></div><div id="s-pw"></div><div id="s-h"></div>';
 aiKeys();tg();pw();health();TIMER=setInterval(health,5000)}
const note=(id,t,ok)=>{const e=$('#'+id);if(e){e.className=ok?'ok':'bad';e.textContent=t}};
async function aiKeys(){
 try{const d=await api('/api/keys');
  $('#s-ai').innerHTML=`<div class="card"><h3>AI keys</h3><small>Paste any key: Gemini, Claude, ChatGPT, OpenRouter, Groq. The provider and a working model are found automatically.</small>
  ${d.keys.map(k=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${esc(k.name)}</b> <span class="pill">${esc(k.provider||'')}</span> <span class="pill ${k.role=='chat'?'t1':''}">${k.role=='chat'?'main':k.role}</span><br><small>${esc(k.masked)}${k.model?' \u00b7 '+esc(k.model):''}</small><div id="kt${k.id}" class="dim"></div></div><button class="b" data-kt="${k.id}">Test</button><button class="b d" data-kd="${k.id}">Delete</button></div>`).join('')||'<div class="dim" style="margin-top:8px">No key yet.</div>'}
  <input id="kn" placeholder="Name (e.g. Claude main)"><input id="kk" placeholder="API key" autocomplete="off" autocapitalize="off" spellcheck="false"><input id="km" placeholder="Model (optional, leave empty = automatic)">
  <select id="kp"><option value="">Provider: automatic</option><option value="gemini">Gemini</option><option value="claude">Claude</option><option value="openai">ChatGPT</option><option value="openrouter">OpenRouter</option><option value="groq">Groq</option><option value="deepseek">DeepSeek</option><option value="custom">Other company (OpenAI-compatible API)</option></select><input id="kb" placeholder="Only for Other: base URL, e.g. https://api.example.com/v1">
  <select id="kr"><option value="chat">Main (used first)</option><option value="backup">Backup (used if main fails)</option><option value="off">Off</option></select>
  <button class="b p" id="ks">Save key</button> <span id="kx"></span></div>`;
  document.querySelectorAll('[data-kt]').forEach(b=>b.onclick=async()=>{const o=$('#kt'+b.dataset.kt);o.textContent='Testing\u2026';try{const r=await post('/api/keys/test',{id:+b.dataset.kt});o.className=r.ok?'ok':'bad';o.textContent=r.detail}catch(e){o.className='bad';o.textContent=e.message}});
  document.querySelectorAll('[data-kd]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this key?')){await api('/api/keys?id='+b.dataset.kd,{method:'DELETE'});aiKeys()}});
  $('#ks').onclick=async()=>{try{await post('/api/keys',{name:$('#kn').value,key:$('#kk').value,model:$('#km').value,provider:$('#kp').value,base:$('#kb').value,role:$('#kr').value});aiKeys()}catch(e){note('kx',e.message,0)}};
 }catch(e){$('#s-ai').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
async function tg(){
 try{const t=await api('/api/telegram');
  $('#s-tg').innerHTML=`<div class="card"><h3>Telegram</h3><small>Screener alerts and weekly archives come to this chat.</small><input id="tt" placeholder="${t.has_token?'Bot token saved '+esc(t.masked)+' (paste to replace)':'Bot token from @BotFather'}" autocomplete="off" autocapitalize="off" spellcheck="false"><input id="tc" placeholder="Chat ID, e.g. 123456789" value="${esc(t.chat_id||'')}" inputmode="numeric"><div class="row"><button class="b p" id="tsv">Save</button><button class="b" id="tts">Send test</button><span id="tx"></span></div></div>`;
  $('#tsv').onclick=async()=>{try{await post('/api/telegram',{token:$('#tt').value,chat_id:$('#tc').value});note('tx','Saved',1);tg()}catch(e){note('tx',e.message,0)}};
  $('#tts').onclick=async()=>{try{const r=await post('/api/telegram/test');note('tx',r.ok?'Message sent':r.error,r.ok)}catch(e){note('tx',e.message,0)}};
 }catch(e){$('#s-tg').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
function pw(){$('#s-pw').innerHTML='<div class="card"><h3>Password</h3><input id="pc" type="password" placeholder="Current password"><input id="pn" type="password" placeholder="New password (10+ characters)"><button class="b p" id="pv">Change</button> <span id="px"></span></div>';
 $('#pv').onclick=async()=>{try{await post('/api/admin/password',{current:$('#pc').value,password:$('#pn').value});note('px','Changed',1)}catch(e){note('px',e.message,0)}}}
async function health(){
 try{const h=await api('/api/health');
  const feeds=Object.entries(h.feeds||{}).sort(),tb=Object.entries(h.tables||{});
  const okf=feeds.filter(([k,v])=>v.age_s!=null&&v.age_s<(v.max_age_s||(v.kind=='rest'?400:30))).length;
  $('#s-h').innerHTML=`<div class="card"><h3>System health</h3><div class="row"><span>Uptime <b>${age(h.uptime_s)}</b></span><span>DB <b>${h.db_mb??'-'} MB</b></span><span>Restarts <b>${h.restarts??'-'}</b></span><span>Feeds OK <b class="${okf==feeds.length?'up':'wr'}">${okf}/${feeds.length}</b></span><span>AI keys <b>${h.ai_keys??0}</b></span></div></div>
  <div class="card"><h3>Tables (how old is the newest row)</h3><table><tr><th>table<th>rows<th>newest</tr>${tb.map(([k,v])=>`<tr><td>${esc(k)}<td>${v.rows??esc(v)}<td class="${v.age_s==null?'dn':v.age_s>900?'wr':'up'}">${age(v.age_s)}</tr>`).join('')}</table></div>
  <div class="card"><h3>Data feeds</h3><table><tr><th>feed<th>state<th>age<th>err</tr>${feeds.map(([k,v])=>{const ok=v.age_s!=null&&v.age_s<(v.max_age_s||(v.kind=='rest'?400:30));return `<tr><td>${esc(k)}<td class="${ok?'up':'dn'}">${ok?'OK':'STALE'}<td>${age(v.age_s)}<td class="dim">${v.errors||0}${v.last_err?' '+esc(String(v.last_err).slice(0,40)):''}</tr>`}).join('')}</table></div>`;
 }catch(e){$('#s-h').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}

(async()=>{try{await api('/api/ping');await api('/api/health');show('home')}catch(e){}})();
tabs();
</script></body></html>
