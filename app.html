<style>

#app{background:radial-gradient(700px 360px at 0% -5%,rgba(61,139,255,.16),transparent),radial-gradient(600px 360px at 100% 0%,rgba(166,107,255,.14),transparent),var(--bg)}

#chartview input[type=text]{width:100%;border:0;background:var(--bg);box-shadow:inset 2px 2px 6px var(--s1),inset -2px -2px 6px var(--s2);border-radius:10px;padding:10px;outline:0}
