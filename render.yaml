services:
  - type: web
    name: flowmap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COINS
        value: BTC,ETH
      - key: EXCHANGES
        value: binance,okx,bybit,bitget,gate,mexc,delta,coindcx
