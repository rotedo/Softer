<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowMap</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#9aa4b2;--line:#262c36;--up:#3fb950;--down:#f85149;--acc:#58a6ff;--poc:#f2cc60;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#fff;--card:#f3f5f7;--text:#111827;--muted:#5b6472;--line:#dfe3e8;--up:#0a8f57;--down:#d6334a;--acc:#1f6feb;--poc:#b45309;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:10px 12px calc(20px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:6px 0}.m{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border-radius:12px;padding:10px;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 13px;border-radius:10px;background:var(--card);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.in{width:100%;min-height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 16px;font:inherit}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--up)}.sw.on i{left:25px}
.fpw{display:flex}.fpa{flex:none}.fps{overflow-x:auto;flex:1}canvas{display:block}
.cap{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.ob{position:relative;display:flex;justify-content:space-between;font:12px ui-monospace,monospace;padding:3px 6px;margin:1px 0}.ob i{position:absolute;right:0;top:0;bottom:0;opacity:.22}.ob span{position:relative}
.u{color:var(--up)}.d{color:var(--down)}.bu{background:var(--up)}.bd{background:var(--down)}
.mid{text-align:center;font:600 16px ui-monospace,monospace;padding:6px;color:var(--acc)}
.lm{display:flex;align-items:center;gap:8px;height:22px;font:12px ui-monospace,monospace;color:var(--muted)}.lm b{width:78px;font-weight:400}.lm div{display:flex;height:12px}
</style>
</head>
<body>
<div id="app">
<div class="row"><h1>FlowMap</h1><span class="m" id="stat">connecting...</span></div>
<div class="card row"><div><b>Merge all exchanges</b><div class="m" id="mtxt"></div></div><button class="sw on" id="sw" role="switch" aria-checked="true" aria-label="Merge all exchanges" data-a="merge"><i></i></button></div>
<div class="chips" id="exs"></div>
<input id="q" class="in" placeholder="Search coin: BTC, ETH" aria-label="Search coin" autocomplete="off">
<div class="chips" id="coins"></div>
<div class="chips" id="tfs"></div>
<div class="chips" id="views"></div>
<div class="card" id="out">Loading...</div>
</div>
<script>
const $=s=>document.querySelector(s);
const S={coin:"BTC",ex:"binance",merged:true,tf:5,view:"foot",q:"",tick:0};
let META=null,busy=false;
const VIEWS=[["foot","Footprint"],["chart","Chart"],["delta","Delta / CVD"],["book","Order Book"],["depth","Liquidity"],["liqmap","Liq Map"],["heat","Heatmap"],["fund","Funding / OI"]];
const TFS=[[1,"1m"],[5,"5m"],[15,"15m"],[60,"1h"]];
const CAP={foot:"Each row = a price. Left number = sells, right = buys. Yellow box = most traded price (POC). Green/red tint = one side dominates. Thin candle sits beside its cluster. Below: delta (buys minus sells) and volume.",chart:"Candles with volume, delta bars and CVD line (running total of buys minus sells). All exchanges combined when Merge is on.",delta:"Bars = buys minus sells per candle. Line = CVD. Line rising = buyers in control.",book:"Waiting orders, merged across exchanges. Longer bar = bigger wall.",depth:"Total size you can buy (right) or sell (left) as price moves away. Steep side = strong wall.",liqmap:"Realized liquidations by price (Binance and Bybit). Green = longs wiped, red = shorts wiped.",heat:"Realized liquidations over time. Bright = many. White line = price.",fund:"Funding fee (positive: longs pay shorts) and open interest per exchange."};
const NICE=(v)=>{const a=Math.abs(v);return a>=1e9?(v/1e9).toFixed(2)+"B":a>=1e6?(v/1e6).toFixed(1)+"M":a>=1e3?(v/1e3).toFixed(1)+"k":v.toFixed(0)};
const Q=v=>{const a=Math.abs(v);return a>=100?v.toFixed(0):a>=10?v.toFixed(1):a>=1?v.toFixed(2):a>=.01?v.toFixed(3):v.toFixed(4)};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const api=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const exq=()=>S.merged?"all":S.ex;
const P=v=>v>=100?v.toFixed(1):v>=1?v.toFixed(3):v.toFixed(5);
const hhmm=t=>{const d=new Date(t*1000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
function ctrl(){
 $("#sw").className="sw"+(S.merged?" on":"");$("#sw").setAttribute("aria-checked",S.merged);
 $("#mtxt").textContent=S.merged?"Combined data of all connected exchanges":"One exchange only";
 $("#exs").style.display=S.merged?"none":"flex";
 $("#exs").innerHTML=META.exchanges.map(e=>`<button class="chip ${e.id===S.ex?"on":""}" data-a="ex:${e.id}"><span class="dot" style="background:${e.status==="connected"?"var(--up)":"var(--down)"}"></span>${e.name}</button>`).join("");
 coins();
 $("#tfs").innerHTML=TFS.map(t=>`<button class="chip ${t[0]===S.tf?"on":""}" data-a="tf:${t[0]}">${t[1]}</button>`).join("");
 $("#views").innerHTML=VIEWS.map(v=>`<button class="chip ${v[0]===S.view?"on":""}" data-a="view:${v[0]}">${v[1]}</button>`).join("");
 const ok=META.exchanges.filter(e=>e.status==="connected").length;$("#stat").textContent=ok+"/"+META.exchanges.length+" exchanges live";
}
function coins(){const l=META.coins.filter(c=>c.includes(S.q));$("#coins").innerHTML=l.length?l.map(c=>`<button class="chip ${c===S.coin?"on":""}" data-a="coin:${c}">${c}</button>`).join(""):'<span class="m">No coin found</span>'}
function setup(canvas,w,h){const r=devicePixelRatio||1;canvas.width=w*r;canvas.height=h*r;canvas.style.width=w+"px";canvas.style.height=h+"px";const g=canvas.getContext("2d");g.scale(r,r);return g}
function empty(m){return `<div class="m" style="padding:20px 6px">${m}</div>`}
/* ---------- footprint ---------- */
function vFoot(d){
 const C=d.candles;if(!C.length)return empty("Waiting for trades... check /api/health if this stays empty.");
 const tk=d.tick;let hi=-1/0,lo=1/0;C.forEach(c=>{hi=Math.max(hi,c.h);lo=Math.min(lo,c.l)});
 const top=Math.ceil(hi/tk)*tk+tk,bot=Math.floor(lo/tk)*tk-tk,rows=Math.round((top-bot)/tk),rh=15,cw=96,H=rows*rh+58;
 const yy=p=>(top-p)/tk*rh;
 const ax=document.createElement("canvas"),bd=document.createElement("canvas");
 const ga=setup(ax,54,H),g=setup(bd,C.length*cw+4,H);
 const up=css("--up"),dn=css("--down"),tx=css("--text"),mu=css("--muted"),ln=css("--line"),poc=css("--poc");
 ga.font="10px ui-monospace,monospace";ga.fillStyle=mu;ga.textAlign="right";ga.textBaseline="middle";
 for(let r=0;r<rows;r++){const p=top-(r+1)*tk;if(r%2==0)ga.fillText(P(p),52,r*rh+rh/2+rh)}
 g.font="9px ui-monospace,monospace";g.textBaseline="middle";g.textAlign="center";
 C.forEach((c,i)=>{
  const x0=i*cw+2,col=c.c>=c.o?up:dn;
  g.strokeStyle=ln;g.beginPath();g.moveTo(x0+cw-1,0);g.lineTo(x0+cw-1,H-56);g.stroke();
  g.strokeStyle=col;g.fillStyle=col;g.beginPath();g.moveTo(x0+6,yy(c.h));g.lineTo(x0+6,yy(c.l));g.stroke();
  const yo=yy(c.o),yc=yy(c.c);g.fillRect(x0+3,Math.min(yo,yc),6,Math.max(2,Math.abs(yo-yc)));
  let mx=0,pk=null;c.lv.forEach(l=>{const t=l[1]+l[2];if(t>mx){mx=t;pk=l}});
  c.lv.forEach(l=>{const y=yy(l[0]+tk),s=l[2],b=l[1],t=s+b,xx=x0+14,w=cw-16;
   const imb=b>s*3?up:s>b*3?dn:null;g.globalAlpha=.12+.5*t/mx;g.fillStyle=imb||mu;g.fillRect(xx,y+1,w,rh-2);g.globalAlpha=1;
   g.fillStyle=imb||tx;g.fillText(Q(s)+" x "+Q(b),xx+w/2,y+rh/2)});
  if(pk){g.strokeStyle=poc;g.lineWidth=1.5;g.strokeRect(x0+14,yy(pk[0]+tk)+1,cw-16,rh-2);g.lineWidth=1}
  g.textAlign="center";g.font="10px ui-monospace,monospace";const mx0=x0+cw/2;
  g.fillStyle=c.delta>=0?up:dn;g.fillText("D "+(c.delta>=0?"+":"")+Q(c.delta),mx0,rows*rh+12);
  g.fillStyle=tx;g.fillText("V "+Q(c.buy+c.sell),mx0,rows*rh+27);g.fillStyle=mu;g.fillText(hhmm(c.t),mx0,rows*rh+43);g.font="9px ui-monospace,monospace"});
 const w=document.createElement("div");w.className="fpw";const a=document.createElement("div");a.className="fpa";a.append(ax);
 const s=document.createElement("div");s.className="fps";s.append(bd);w.append(a,s);setTimeout(()=>{s.scrollLeft=s.scrollWidth},0);return w;
}
/* ---------- chart / delta ---------- */
function vChart(d,mode){
 const C=d.candles;if(!C.length)return empty("Waiting for trades...");
 const W=Math.min(860,window.innerWidth-48),H=mode==="chart"?380:300,cv=document.createElement("canvas"),g=setup(cv,W,H);
 const up=css("--up"),dn=css("--down"),acc=css("--acc"),mu=css("--muted"),ln=css("--line");
 const n=C.length,bw=W/n,pan=(y0,y1,vals,sym)=>{const mx=Math.max(...vals.map(Math.abs),1e-9);const z=sym?(y0+y1)/2:y1;g.strokeStyle=ln;g.beginPath();g.moveTo(0,z);g.lineTo(W,z);g.stroke();
  vals.forEach((v,i)=>{const h=Math.abs(v)/mx*(sym?(y1-y0)/2:(y1-y0));g.fillStyle=v>=0?up:dn;g.fillRect(i*bw+1,v>=0?z-h:z,Math.max(1,bw-2),h)})};
 let cvd=0;const cv2=C.map(c=>cvd+=c.delta);g.font="10px system-ui";g.fillStyle=mu;
 let y=0;if(mode==="chart"){const hi=Math.max(...C.map(c=>c.h)),lo=Math.min(...C.map(c=>c.l)),sy=p=>(1-(p-lo)/(hi-lo||1))*(H*.46)+4;
  C.forEach((c,i)=>{const col=c.c>=c.o?up:dn,x=i*bw+bw/2;g.strokeStyle=col;g.fillStyle=col;g.beginPath();g.moveTo(x,sy(c.h));g.lineTo(x,sy(c.l));g.stroke();g.fillRect(i*bw+1,Math.min(sy(c.o),sy(c.c)),Math.max(1,bw-2),Math.max(1.5,Math.abs(sy(c.o)-sy(c.c))))});
  g.fillStyle=mu;g.fillText("High "+P(hi)+"  Low "+P(lo),4,H*.5+8);g.fillText("Volume",4,H*.52+20);pan(H*.52+22,H*.66,C.map(c=>c.buy+c.sell),false);y=H*.68;g.fillStyle=mu;g.fillText("Delta",4,y+10);pan(y+12,H*.84,C.map(c=>c.delta),true);
  y=H*.86;g.fillStyle=mu;g.fillText("CVD",4,y+10);line(cv2,y+12,H-4)}
 else{g.fillText("Delta per candle",4,12);pan(16,H*.5,C.map(c=>c.delta),true);g.fillStyle=mu;g.fillText("CVD (running total)",4,H*.55);line(cv2,H*.55+6,H-4)}
 function line(v,y0,y1){const lo=Math.min(...v),hi=Math.max(...v);g.strokeStyle=acc;g.lineWidth=2;g.beginPath();v.forEach((a,i)=>{const yy=y1-(a-lo)/(hi-lo||1)*(y1-y0),x=i*bw+bw/2;i?g.lineTo(x,yy):g.moveTo(x,yy)});g.stroke();g.lineWidth=1}
 return cv;
}
/* ---------- other views ---------- */
function vBook(d){if(!d.asks.length)return empty("No order book yet (needs connected exchanges).");
 const mx=Math.max(...d.asks.slice(0,15).concat(d.bids.slice(0,15)).map(x=>x[1]));
 const row=(x,c)=>`<div class="ob"><i class="b${c}" style="width:${x[1]/mx*100}%"></i><span class="${c}">${P(x[0])}</span><span>${Q(x[1])}</span><span class="m">${Q(x[2])}</span></div>`;
 return d.asks.slice(0,15).reverse().map(x=>row(x,"d")).join("")+`<div class="mid">${P(d.mid)}</div>`+d.bids.slice(0,15).map(x=>row(x,"u")).join("")+`<div class="m" style="margin-top:6px">From: ${d.exchanges.join(", ")}</div>`}
function vDepth(d){if(!d.asks.length)return empty("No order book yet.");
 const W=Math.min(860,window.innerWidth-48),H=240,cv=document.createElement("canvas"),g=setup(cv,W,H);
 const mx=Math.max(d.asks.at(-1)[2],d.bids.at(-1)[2]),pmin=d.bids.at(-1)[0],pmax=d.asks.at(-1)[0],X=p=>(p-pmin)/(pmax-pmin||1)*W,Y=v=>H-6-v/mx*(H-16);
 const area=(a,col)=>{g.fillStyle=col;g.globalAlpha=.4;g.beginPath();g.moveTo(X(a[0][0]),H-6);a.forEach((x,i)=>{if(i)g.lineTo(X(x[0]),Y(a[i-1][2]));g.lineTo(X(x[0]),Y(x[2]))});g.lineTo(X(a.at(-1)[0]),H-6);g.closePath();g.fill();g.globalAlpha=1};
 area(d.bids,css("--up"));area(d.asks,css("--down"));g.fillStyle=css("--muted");g.font="10px system-ui";g.fillText(P(pmin),2,12);g.textAlign="right";g.fillText(P(pmax),W-2,12);return cv}
function vLiq(d){if(!d.levels.length)return empty("No liquidations captured yet. They appear as they happen (Binance + Bybit).");
 const mx=Math.max(...d.levels.map(l=>l.long+l.short)),tot=`<div class="m" style="margin-bottom:8px">Longs wiped <b class="u">$${NICE(d.long)}</b> · Shorts wiped <b class="d">$${NICE(d.short)}</b></div>`;
 return tot+d.levels.slice(0,45).map(l=>`<div class="lm"><b>${P(l.p)}</b><div style="width:${(l.long+l.short)/mx*70}%"><i class="bu" style="flex:${l.long};display:block"></i><i class="bd" style="flex:${l.short};display:block"></i></div><span>$${NICE(l.long+l.short)}</span></div>`).join("")}
function vHeat(d,fp){if(!d.cells.length)return empty("No liquidations captured yet.");
 const ts=[...new Set(d.cells.map(c=>c.t))].sort((a,b)=>a-b),ps=d.cells.map(c=>c.p),lo=Math.min(...ps),hi=Math.max(...ps),tk=d.tick,R=Math.round((hi-lo)/tk)+1;
 const t0=ts[0],tf=S.tf>=5?S.tf*60:300,Ccol=Math.round((ts.at(-1)-t0)/tf)+1,W=Math.min(860,window.innerWidth-48),H=300,cw=W/Ccol,rh=H/R,cv=document.createElement("canvas"),g=setup(cv,W,H);
 const mx=Math.max(...d.cells.map(c=>c.long+c.short));g.fillStyle="#1b1036";g.fillRect(0,0,W,H);
 d.cells.forEach(c=>{const t=Math.min(1,Math.sqrt((c.long+c.short)/mx));g.fillStyle=`hsl(${270-t*220} ${55+t*45}% ${10+t*52}%)`;g.fillRect(Math.round((c.t-t0)/tf)*cw,H-(Math.round((c.p-lo)/tk)+1)*rh,cw+.5,rh+.5)});
 if(fp&&fp.candles.length){const ys=p=>H-((p-lo)/tk+.5)*rh;g.strokeStyle="#fff";g.lineWidth=1.6;g.beginPath();let f=1;fp.candles.forEach(c=>{const x=(c.t-t0)/tf*cw+cw/2;if(x<0)return;f?g.moveTo(x,Math.max(0,Math.min(H,ys(c.c)))):g.lineTo(x,Math.max(0,Math.min(H,ys(c.c))));f=0});g.stroke()}
 return cv}
function vFund(d){if(!d.rows.length)return empty("Needs connected exchanges.");
 const f=v=>v==null?"-":(v*100).toFixed(4)+"%";
 return `<table><tr><th>Exchange</th><th>Funding</th><th>Open interest</th></tr>${d.rows.map(r=>`<tr><td>${r.name}</td><td class="${r.funding>0?"u":r.funding<0?"d":""}">${f(r.funding)}</td><td>${r.oi_usd?"$"+NICE(r.oi_usd):"-"}</td></tr>`).join("")}<tr><td><b>Total / avg</b></td><td><b>${f(d.funding_avg)}</b></td><td><b>$${NICE(d.oi_total)}</b></td></tr></table>`}
/* ---------- render ---------- */
async function render(){
 if(busy||!META)return;busy=true;const out=$("#out");
 try{
  const sc=out.querySelector(".fps"),keep=sc?sc.scrollLeft:null,atEnd=sc&&sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-8,e=encodeURIComponent(exq()),b=`coin=${S.coin}&ex=${e}`;
  let el;const v=S.view;
  if(v==="foot")el=vFoot(await api(`/api/footprint?${b}&tf=${S.tf}&n=22&tick=${S.tick}`));
  else if(v==="chart"||v==="delta")el=vChart(await api(`/api/footprint?${b}&tf=${S.tf}&n=60&lv=0`),v);
  else if(v==="book")el=vBook(await api(`/api/book?${b}`));
  else if(v==="depth")el=vDepth(await api(`/api/book?${b}`));
  else if(v==="liqmap")el=vLiq(await api(`/api/liqs?${b}&minutes=360`));
  else if(v==="heat"){const tf=Math.max(S.tf,5);const [l,f]=await Promise.all([api(`/api/liqs?${b}&minutes=360&tf=${tf}`),api(`/api/footprint?${b}&tf=${tf}&n=80&lv=0`)]);el=vHeat(l,f)}
  else el=vFund(await api(`/api/derivs?${b}`));
  out.replaceChildren();if(typeof el==="string")out.innerHTML=el;else out.append(el);
  out.insertAdjacentHTML("beforeend",`<div class="cap">${CAP[v]}</div>`);
  const ns=out.querySelector(".fps");if(ns&&keep!==null&&!atEnd)ns.scrollLeft=keep;
 }catch(err){out.innerHTML=empty("Error: "+err.message+". Is the backend running?")}
 busy=false}
async function loadMeta(){try{META=await api("/api/meta");if(!META.coins.includes(S.coin))S.coin=META.coins[0];if(!META.exchanges.find(e=>e.id===S.ex))S.ex=META.exchanges[0]?.id}catch(e){}if(META){ctrl()}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const[a,b]=el.dataset.a.split(":");
 if(a==="merge")S.merged=!S.merged;else if(a==="ex")S.ex=b;else if(a==="coin"){S.coin=b;S.q="";$("#q").value=""}else if(a==="tf")S.tf=+b;else if(a==="view")S.view=b;
 ctrl();$("#out").innerHTML="Loading...";render()});
$("#q").oninput=e=>{S.q=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(META)coins()};
(async()=>{await loadMeta();render();setInterval(()=>{if(!document.hidden)render()},5000);setInterval(()=>{if(!document.hidden)loadMeta()},20000)})();
</script>
</body>
</html>
